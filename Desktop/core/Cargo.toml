[package]
name = "dictate-core"
version = "1.1.0-beta.4"
edition = "2021"
license = "MIT"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
tempfile = "3"
unicode-normalization = "0.1"
