name: Release DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Build and verify release package
        run: ./Scripts/release-preflight.sh

      - name: Attach DMG to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/Dictate.dmg dist/Dictate.dmg.sha256 --clobber
