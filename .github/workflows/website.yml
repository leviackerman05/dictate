name: Website

on:
  push:
    paths:
      - "Website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "Website/**"
      - ".github/workflows/website.yml"

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:links
      - run: npm run build
