name: Windows desktop checks
on:
  push:
    paths: ['Desktop/**', '.cargo/**', 'Tests/Fixtures/**', '.github/workflows/portable.yml']
  pull_request:
    paths: ['Desktop/**', '.cargo/**', 'Tests/Fixtures/**', '.github/workflows/portable.yml']
permissions:
  contents: read
jobs:
  check:
    # Standard runners are free for this public repository. No paid larger runners,
    # cache storage, artifact upload, or external build service is used.
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: Desktop
      - run: npm run build
        working-directory: Desktop
      - run: cargo test --locked --manifest-path Desktop/core/Cargo.toml
      - name: Validate Store packaging script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path Scripts/build-windows-msix.ps1), [ref]$null, [ref]$parseErrors)
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Stage app-local speech runtime
        run: ./Scripts/prepare-windows-runtime.ps1
      - run: cargo check --locked --manifest-path Desktop/src-tauri/Cargo.toml
      - name: Prepare verified model and synthetic speech
        run: python Scripts/prepare-portable-smoke.py
        env:
          DICTATE_SMOKE_DIR: ${{ runner.temp }}/dictate-smoke
      - name: Test native preferences and microphone meter
        run: cargo test --release --locked --manifest-path Desktop/src-tauri/Cargo.toml --bin dictate-desktop
      - name: Exercise native local recognition without a microphone
        run: cargo test --locked --manifest-path Desktop/src-tauri/Cargo.toml --test recognition_smoke -- --ignored
        env:
          DICTATE_SMOKE_DIR: ${{ runner.temp }}/dictate-smoke
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: powershell -NoProfile -File ${{ github.workspace }}/Scripts/run-windows-test.ps1
